  <!-- Ornate gold belt (from photo) -->
  <rect x="210" y="238" width="140" height="18" rx="3" fill="#C9A227" stroke="#5D4037" stroke-width="3"/>
  <circle cx="280" cy="247" r="14" fill="#E8C547" stroke="#5D4037" stroke-width="3"/>
  <circle cx="280" cy="247" r="6" fill="#8B5E3C" stroke="#5D4037" stroke-width="2"/>

  <!-- Neckline -->
