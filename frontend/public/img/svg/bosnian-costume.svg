  <ellipse cx="335" cy="180" rx="8" ry="6" fill="#3D2914" stroke="#5D4037" stroke-width="1.5"/>
  <ellipse cx="340" cy="210" rx="8" ry="6" fill="#3D2914" stroke="#5D4037" stroke-width="1.5"/>
  <ellipse cx="342" cy="242" rx="10" ry="14" fill="#3D2914" stroke="#5D4037" stroke-width="2.5"/>

  <!-- Shoes -->
  <ellipse cx="210" cy="352" rx="32" ry="12" fill="#3D2914" stroke="#5D4037" stroke-width="3"/>
  <ellipse cx="350" cy="352" rx="32" ry="12" fill="#3D2914" stroke="#5D4037" stroke-width="3"/>

  <!-- Ground line + kilim bunting -->
  <line x1="30" y1="385" x2="530" y2="385" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
  <path d="M55 385 L72 353 L89 385 Z" fill="#C62828" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M105 385 L122 350 L139 385 Z" fill="#1B2A4A" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/>
