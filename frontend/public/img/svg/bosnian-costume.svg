  <circle cx="262" cy="70" r="4" fill="#C9A227" stroke="#5D4037" stroke-width="1.5"/>
  <circle cx="280" cy="66" r="4" fill="#C9A227" stroke="#5D4037" stroke-width="1.5"/>
  <circle cx="298" cy="70" r="4" fill="#C9A227" stroke="#5D4037" stroke-width="1.5"/>

  <!-- Long braid over shoulder (from photo) -->
  <path d="M318 118 C338 145 348 185 342 235"
