  <!-- Gold braid on vest -->
  <path d="M235 175 H270" stroke="#C9A227" stroke-width="3"/>
  <path d="M235 195 H270" stroke="#C9A227" stroke-width="3"/>
  <path d="M235 215 H270" stroke="#C9A227" stroke-width="3"/>
  <path d="M290 175 H325" stroke="#C9A227" stroke-width="3"/>
  <path d="M290 195 H325" stroke="#C9A227" stroke-width="3"/>
