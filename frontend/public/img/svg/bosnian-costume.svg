  <!-- Face -->
  <circle cx="280" cy="115" r="40" fill="#E8C4A8" stroke="#5D4037" stroke-width="3.5"/>
  <circle cx="265" cy="112" r="4.5" fill="#5D4037"/>
  <circle cx="295" cy="112" r="4.5" fill="#5D4037"/>
  <path d="M268 130 Q280 140 292 130" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>

