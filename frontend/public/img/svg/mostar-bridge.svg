  <path d="M95 155 L125 128 L155 155" fill="#C4A484" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Windows -->
  <rect x="112" y="170" width="18" height="22" rx="2" fill="#1B2A4A" stroke="#5D4037" stroke-width="2.5"/>
  <rect x="112" y="205" width="18" height="18" fill="#1B2A4A" stroke="#5D4037" stroke-width="2.5"/>
  <rect x="112" y="235" width="18" height="18" fill="#1B2A4A" stroke="#5D4037" stroke-width="2.5"/>
