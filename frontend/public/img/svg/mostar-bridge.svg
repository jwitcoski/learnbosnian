  <path d="M405 370 L422 333 L439 370 Z" fill="#2F5D50" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M455 370 L472 338 L489 370 Z" fill="#C62828" stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round"/>
