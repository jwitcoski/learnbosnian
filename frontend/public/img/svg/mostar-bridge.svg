  <path d="M235 160 L238 195" stroke="#5D4037" stroke-width="2" opacity="0.4"/>
  <path d="M267 135 L267 170" stroke="#5D4037" stroke-width="2" opacity="0.4"/>
  <path d="M300 160 L297 195" stroke="#5D4037" stroke-width="2" opacity="0.4"/>
  <path d="M335 205 L330 240" stroke="#5D4037" stroke-width="2" opacity="0.4"/>

