name: Deploy with Terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STAGE: prod
  # Stable IDs from the first successful CloudFront deploy
  CLOUDFRONT_DISTRIBUTION_ID: E22QTEONDMDA3Z
  S3_BUCKET: learn-bosnian-frontend-prod
  # Audio / recorder (created by first audio.tf apply; imported each run)
  AUDIO_CLOUDFRONT_DISTRIBUTION_ID: E1N23323AD0C24
  AUDIO_CLOUDFRONT_URL: https://d2x0bm1qxn5szq.cloudfront.net
  AUDIO_API_URL: https://btmud046ok.execute-api.us-east-1.amazonaws.com/prod
  AUDIO_API_ID: btmud046ok
  RECORDER_CLOUDFRONT_DISTRIBUTION_ID: E2JB1ZR37PXHXX
  RECORDER_CLOUDFRONT_URL: https://d13sxy8sx1wedn.cloudfront.net
  RECORDER_BUCKET: learn-bosnian-recorder-prod
  AUDIO_BUCKET: learn-bosnian-audio-prod

jobs:
  terraform-plan:
    name: Terraform plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare Lambda package
        run: |
          node scripts/sync-content.cjs
          cd backend && npm install --omit=dev

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -var="stage=${STAGE}" -input=false

  deploy:
    name: Terraform apply and deploy sites
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare Lambda package
        run: |
          node scripts/sync-content.cjs
          cd backend && npm install --omit=dev

      - name: Terraform Init
        run: terraform init -input=false

      - name: Import existing resources
        run: |
          set +e
          terraform import -var="stage=${STAGE}" aws_s3_bucket.frontend "${S3_BUCKET}"
          terraform import -var="stage=${STAGE}" aws_dynamodb_table.main "learnbosnian-table-${STAGE}"
          terraform import -var="stage=${STAGE}" aws_cloudfront_distribution.frontend "${CLOUDFRONT_DISTRIBUTION_ID}"

          SITE_ZONE_ID=$(aws route53 list-hosted-zones-by-name --dns-name howtospeakbosnian.com. \
            --query "HostedZones[?Name=='howtospeakbosnian.com.'].Id | [0]" --output text | sed 's|/hostedzone/||')
          CERT_ARN=$(aws acm list-certificates --region us-east-1 \
            --query "CertificateSummaryList[?DomainName=='howtospeakbosnian.com'].CertificateArn | [0]" \
            --output text)
          if [ -n "$CERT_ARN" ] && [ "$CERT_ARN" != "None" ]; then
            terraform import -var="stage=${STAGE}" aws_acm_certificate.frontend "$CERT_ARN"
          fi
          if [ -n "$SITE_ZONE_ID" ] && [ "$SITE_ZONE_ID" != "None" ]; then
            terraform import -var="stage=${STAGE}" aws_route53_record.site_a "${SITE_ZONE_ID}_howtospeakbosnian.com_A"
            terraform import -var="stage=${STAGE}" aws_route53_record.site_aaaa "${SITE_ZONE_ID}_howtospeakbosnian.com_AAAA"
            terraform import -var="stage=${STAGE}" aws_route53_record.www_a "${SITE_ZONE_ID}_www.howtospeakbosnian.com_A"
            terraform import -var="stage=${STAGE}" aws_route53_record.www_aaaa "${SITE_ZONE_ID}_www.howtospeakbosnian.com_AAAA"
            if [ -n "$CERT_ARN" ] && [ "$CERT_ARN" != "None" ]; then
              aws acm describe-certificate --certificate-arn "$CERT_ARN" \
                --query "Certificate.DomainValidationOptions[].[DomainName,ResourceRecord.Name,ResourceRecord.Type]" \
                --output text | while read -r DOMAIN REC_NAME REC_TYPE; do
                  [ -z "$DOMAIN" ] && continue
                  KEY="${REC_NAME%.}"
                  terraform import -var="stage=${STAGE}" \
                    "aws_route53_record.cert_validation[\"${DOMAIN}\"]" \
                    "${SITE_ZONE_ID}_${KEY}_${REC_TYPE}"
                done
            fi
          fi
          OAC_ID=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?Name=='learnbosnian-frontend-oac-${STAGE}'].Id | [0]" \
            --output text)
          if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ]; then
            terraform import -var="stage=${STAGE}" aws_cloudfront_origin_access_control.frontend "$OAC_ID"
          fi

          # Audio + recorder (state is local to the runner, so re-import every deploy)
          terraform import -var="stage=${STAGE}" aws_s3_bucket.audio "${AUDIO_BUCKET}"
          terraform import -var="stage=${STAGE}" aws_s3_bucket.recorder "${RECORDER_BUCKET}"
          terraform import -var="stage=${STAGE}" aws_s3_bucket_public_access_block.audio "${AUDIO_BUCKET}"
          terraform import -var="stage=${STAGE}" aws_s3_bucket_public_access_block.recorder "${RECORDER_BUCKET}"
          terraform import -var="stage=${STAGE}" aws_s3_bucket_cors_configuration.audio "${AUDIO_BUCKET}"
          terraform import -var="stage=${STAGE}" aws_s3_bucket_policy.audio "${AUDIO_BUCKET}"
          terraform import -var="stage=${STAGE}" aws_s3_bucket_policy.recorder "${RECORDER_BUCKET}"
          terraform import -var="stage=${STAGE}" aws_cloudfront_distribution.audio "${AUDIO_CLOUDFRONT_DISTRIBUTION_ID}"
          terraform import -var="stage=${STAGE}" aws_cloudfront_distribution.recorder "${RECORDER_CLOUDFRONT_DISTRIBUTION_ID}"

          AUDIO_OAC=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?Name=='learnbosnian-audio-oac-${STAGE}'].Id | [0]" \
            --output text)
          if [ -n "$AUDIO_OAC" ] && [ "$AUDIO_OAC" != "None" ]; then
            terraform import -var="stage=${STAGE}" aws_cloudfront_origin_access_control.audio "$AUDIO_OAC"
          fi
          RECORDER_OAC=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?Name=='learnbosnian-recorder-oac-${STAGE}'].Id | [0]" \
            --output text)
          if [ -n "$RECORDER_OAC" ] && [ "$RECORDER_OAC" != "None" ]; then
            terraform import -var="stage=${STAGE}" aws_cloudfront_origin_access_control.recorder "$RECORDER_OAC"
          fi

          terraform import -var="stage=${STAGE}" aws_iam_role.audio_api "learnbosnian-audio-api-${STAGE}"
          terraform import -var="stage=${STAGE}" aws_iam_role_policy.audio_api "learnbosnian-audio-api-${STAGE}:learnbosnian-audio-api-${STAGE}"
          terraform import -var="stage=${STAGE}" aws_lambda_function.audio_api "learnbosnian-audio-api-${STAGE}"
          terraform import -var="stage=${STAGE}" aws_apigatewayv2_api.audio "${AUDIO_API_ID}"
          terraform import -var="stage=${STAGE}" aws_apigatewayv2_stage.audio "${AUDIO_API_ID}/${STAGE}"
          terraform import -var="stage=${STAGE}" aws_lambda_permission.audio_api "learnbosnian-audio-api-${STAGE}/AllowAPIGatewayInvoke"

          # Routes / integration IDs can drift; lookup if possible
          INTEGRATION_ID=$(aws apigatewayv2 get-integrations --api-id "${AUDIO_API_ID}" \
            --query "Items[0].IntegrationId" --output text 2>/dev/null)
          if [ -n "$INTEGRATION_ID" ] && [ "$INTEGRATION_ID" != "None" ]; then
            terraform import -var="stage=${STAGE}" aws_apigatewayv2_integration.audio "${AUDIO_API_ID}/${INTEGRATION_ID}"
          fi
          PROXY_ROUTE=$(aws apigatewayv2 get-routes --api-id "${AUDIO_API_ID}" \
            --query "Items[?RouteKey=='ANY /{proxy+}'].RouteId | [0]" --output text 2>/dev/null)
          if [ -n "$PROXY_ROUTE" ] && [ "$PROXY_ROUTE" != "None" ]; then
            terraform import -var="stage=${STAGE}" aws_apigatewayv2_route.audio_proxy "${AUDIO_API_ID}/${PROXY_ROUTE}"
          fi
          ROOT_ROUTE=$(aws apigatewayv2 get-routes --api-id "${AUDIO_API_ID}" \
            --query "Items[?RouteKey=='ANY /'].RouteId | [0]" --output text 2>/dev/null)
          if [ -n "$ROOT_ROUTE" ] && [ "$ROOT_ROUTE" != "None" ]; then
            terraform import -var="stage=${STAGE}" aws_apigatewayv2_route.audio_root "${AUDIO_API_ID}/${ROOT_ROUTE}"
          fi
          exit 0

      - name: Terraform Apply
        env:
          # Empty GitHub secrets must NOT become TF_VAR_*='' (that overrides defaults)
          RECORDING_PASSWORD_SECRET: ${{ secrets.RECORDING_PASSWORD }}
          AUDIO_TOKEN_SECRET_SECRET: ${{ secrets.AUDIO_TOKEN_SECRET }}
        run: |
          # Default shared studio password when no repo secret is set
          export TF_VAR_recording_password="${RECORDING_PASSWORD_SECRET:-GornjiVakuf}"
          export TF_VAR_audio_token_secret="${AUDIO_TOKEN_SECRET_SECRET:-GornjiVakuf-audio-token}"
          terraform apply -auto-approve -var="stage=${STAGE}" -input=false
        continue-on-error: true

      - name: Read infra outputs
        id: out
        run: |
          set +e
          AUDIO_BASE=$(terraform output -raw audio_cloudfront_url 2>/dev/null)
          AUDIO_API=$(terraform output -raw audio_api_url 2>/dev/null)
          RECORDER_BUCKET_OUT=$(terraform output -raw recorder_bucket_name 2>/dev/null)
          RECORDER_CF=$(terraform output -raw recorder_cloudfront_distribution_id 2>/dev/null)
          RECORDER_URL=$(terraform output -raw recorder_cloudfront_url 2>/dev/null)

          case "$AUDIO_BASE" in https://*) ;; *) AUDIO_BASE="" ;; esac
          case "$AUDIO_API" in https://*) ;; *) AUDIO_API="" ;; esac
          case "$RECORDER_URL" in https://*) ;; *) RECORDER_URL="" ;; esac
          case "$RECORDER_BUCKET_OUT" in learn-bosnian-*) ;; *) RECORDER_BUCKET_OUT="" ;; esac
          case "$RECORDER_CF" in E*) ;; *) RECORDER_CF="" ;; esac

          echo "audio_base=${AUDIO_BASE:-$AUDIO_CLOUDFRONT_URL}" >> "$GITHUB_OUTPUT"
          echo "audio_api=${AUDIO_API:-$AUDIO_API_URL}" >> "$GITHUB_OUTPUT"
          echo "recorder_bucket=${RECORDER_BUCKET_OUT:-$RECORDER_BUCKET}" >> "$GITHUB_OUTPUT"
          echo "recorder_cf=${RECORDER_CF:-$RECORDER_CLOUDFRONT_DISTRIBUTION_ID}" >> "$GITHUB_OUTPUT"
          echo "recorder_url=${RECORDER_URL:-$RECORDER_CLOUDFRONT_URL}" >> "$GITHUB_OUTPUT"

      - name: Build lesson site
        env:
          REACT_APP_AUDIO_BASE_URL: ${{ steps.out.outputs.audio_base }}
          REACT_APP_AUDIO_API_URL: ${{ steps.out.outputs.audio_api }}
        run: |
          node scripts/sync-content.cjs
          cd frontend
          npm install
          CI=false npm run build

      - name: Deploy frontend to S3
        run: aws s3 sync frontend/build/ "s3://${S3_BUCKET}" --delete

      - name: Invalidate lesson CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Build recorder studio
        env:
          VITE_AUDIO_API_URL: ${{ steps.out.outputs.audio_api }}
          VITE_AUDIO_PUBLIC_BASE: ${{ steps.out.outputs.audio_base }}
        run: |
          cd recorder
          npm install
          npm run build

      - name: Deploy recorder to S3
        run: |
          aws s3 sync recorder/dist/ "s3://${{ steps.out.outputs.recorder_bucket }}" --delete

      - name: Invalidate recorder CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.out.outputs.recorder_cf }}" \
            --paths "/*"

      - name: Site URLs
        run: |
          echo "Lesson site: https://howtospeakbosnian.com"
          echo "CloudFront: https://dz4szsos3tpia.cloudfront.net"
          echo "Audio CDN: ${{ steps.out.outputs.audio_base }}"
          echo "Recorder: ${{ steps.out.outputs.recorder_url }}"
          echo "Recorder API: ${{ steps.out.outputs.audio_api }}"
